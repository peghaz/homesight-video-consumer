[pytest]
testpaths = tests
addopts = -ra
markers =
    live: actual RTSP camera
    dataset: chronological labeled camera recordings
    s3: real S3 endpoint
    real_rtsp_s3: Real RTSP Test with S3 (record, upload, download and playback)
    packaging: clean installed wheel and C++ consumer
    gpu: GPU decoding
    resilience: pytest-owned RTSP replay and MinIO failure recovery
    media: actual H.264/H.265 recordings in MP4/Matroska
    measurements: separate analyzer/upload timings and five-minute resource baseline
    platforms: isolated Ubuntu 22.04 Debug/Release/S3-disabled installation
